name: Quality checks

on:
  workflow_call:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v4

    - uses: actions/setup-node@v3
      with:
        node-version: 24
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint and type-check
      run: npm run lint && npm run build-types && npm run check-types

    - name: Init env
      run: bash dev/init-env.sh

    - name: Build UI
      run: NODE_CONFIG_DIR=$PWD/api/config/ npm -w ui run build

    - name: Start dev dependencies
      run: docker compose up -d --wait

    - name: Start dev API
      run: |
        set -a && . ./.env && set +a
        NODE_ENV=development NODE_CONFIG_DIR=$PWD/api/config/ node api/index.ts &

    # Sync mirrors artefacts *from* an upstream registry, so exercising it needs a
    # second one. Same code, different port / database / data dir.
    - name: Start upstream registry API
      run: |
        set -a && . ./.env && set +a
        NODE_ENV=development NODE_CONFIG_DIR=$PWD/api/config/ \
          PORT=$DEV_UPSTREAM_API_PORT \
          MONGO_URL=mongodb://localhost:$MONGO_PORT/data-fair-registry-upstream \
          DATA_DIR=./data-upstream \
          node api/index.ts &

    - name: Wait for both APIs
      run: |
        set -a && . ./.env && set +a
        for p in $DEV_API_PORT $DEV_UPSTREAM_API_PORT; do
          timeout 60 bash -c "until curl -sf http://localhost:$p/api/ping >/dev/null; do sleep 1; done"
          echo "api on :$p is up"
        done

    - name: Run tests
      run: npm run test-unit && npm run test-api
