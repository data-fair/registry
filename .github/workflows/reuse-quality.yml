name: Quality checks

on:
  workflow_call:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint and build types
      run: npm run lint && npm run build-types

    - name: Init .env
      run: cp dev/default.env .env

    # every later step gets the variables of .env, as npm run dev exports them to its processes
    - name: Export .env to the next steps
      run: grep -vE '^\s*(#|$)' .env >> "$GITHUB_ENV" # GITHUB_ENV accepts only NAME=value lines, no comments

    # also writes the .d.ts files of ui/dts (auto-imports, components, typed router) vue-tsc needs
    - name: Build UI
      run: NODE_CONFIG_DIR=$PWD/api/config/ npm -w ui run build

    - name: Type-check
      run: npm run check-types

    # the build above leaves dev-setup nothing to build
    - name: Start dev dependencies
      run: npm run dev-deps

    # the processes of npm run dev, logs in dev/logs for the upload below. Sync mirrors artefacts *from* an
    # upstream registry, so exercising it needs a second one (dev:api-upstream): same code, its own port,
    # database and data dir
    - name: Start dev API and upstream API
      run: |
        mkdir -p dev/logs
        npm run dev:api > dev/logs/api.log 2>&1 &
        npm run dev:api-upstream > dev/logs/api-upstream.log 2>&1 &

    - name: Wait for both APIs
      run: |
        for p in api:$DEV_API_PORT api-upstream:$DEV_UPSTREAM_API_PORT; do
          if ! timeout 60 bash -c "until curl -sf http://localhost:${p#*:}/api/ping >/dev/null; do sleep 1; done"; then
            tail -n 100 dev/logs/${p%%:*}.log
            exit 1
          fi
          echo "${p%%:*} on :${p#*:} is up"
        done

    - name: Run tests
      run: npm run test-unit && npm run test-api

    - name: Containers logs
      if: failure()
      run: docker compose --profile '*' logs

    - name: Upload test results and process logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: |
          test-results/
          dev/logs/
